<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">HabitPulse production architecture</title>
  <desc id="desc">A layered view from the responsive dashboard through Django security, domain services, PostgreSQL persistence, and delivery operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4ee"/><stop offset="1" stop-color="#eee9f8"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d293c"/><stop offset="1" stop-color="#443c61"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#302947" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#82749d"/></marker>
    <style>
      .label{font:700 14px Inter,Arial,sans-serif;fill:#6f6780;letter-spacing:1.7px}.title{font:800 31px Inter,Arial,sans-serif;fill:#252131}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#746d80}.card-title{font:700 18px Inter,Arial,sans-serif;fill:#282334}.card-copy{font:400 13px Inter,Arial,sans-serif;fill:#746d80}.small{font:600 12px Inter,Arial,sans-serif;fill:#746d80}.white{fill:#fff}.flow{fill:none;stroke:#82749d;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#b5aac6;stroke-width:1.6;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="70" r="190" fill="#f47f6b" opacity=".07"/><circle cx="110" cy="850" r="210" fill="#7657e8" opacity=".07"/>

  <text x="72" y="65" class="label">HABITPULSE · SYSTEM DESIGN</text>
  <text x="72" y="106" class="title">A secure path from intention to measurable progress</text>
  <text x="72" y="135" class="subtitle">One deployable application, explicit trust boundaries, and an auditable daily check-in model.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="182" width="1300" height="132" rx="22" fill="url(#hero)"/>
    <circle cx="126" cy="248" r="34" fill="#7657e8"/><path d="M112 252l9 9 20-24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="226" class="label white" opacity=".65">EXPERIENCE LAYER</text>
    <text x="178" y="257" class="card-title white">Responsive habit dashboard</text>
    <text x="178" y="282" class="card-copy white" opacity=".72">Accessible HTML · modern CSS · safe DOM rendering · Fetch API · live analytics</text>
    <rect x="1010" y="218" width="304" height="61" rx="14" fill="#fff" opacity=".09"/>
    <text x="1034" y="242" class="small white" opacity=".74">TRUST CONTEXT</text>
    <text x="1034" y="265" class="card-copy white">Session cookie + CSRF token</text>
  </g>

  <path d="M720 314v47" class="flow"/><text x="742" y="343" class="small">HTTPS / JSON</text>

  <g filter="url(#shadow)">
    <rect x="70" y="374" width="1300" height="174" rx="22" fill="#fffdfa" stroke="#e3ddd4"/>
    <text x="98" y="407" class="label">APPLICATION &amp; SECURITY BOUNDARY · DJANGO 6</text>
    <rect x="98" y="430" width="222" height="86" rx="14" fill="#f1edfc"/><circle cx="124" cy="457" r="10" fill="#7657e8"/><text x="145" y="461" class="card-title">Identity gate</text><text x="116" y="490" class="card-copy">Sessions · CSRF · ownership</text>
    <rect x="342" y="430" width="222" height="86" rx="14" fill="#fff0ed"/><circle cx="368" cy="457" r="10" fill="#f47f6b"/><text x="389" y="461" class="card-title">Versioned API</text><text x="360" y="490" class="card-copy">Validation · error contracts</text>
    <rect x="586" y="430" width="222" height="86" rx="14" fill="#eaf7f2"/><circle cx="612" cy="457" r="10" fill="#65bfa5"/><text x="633" y="461" class="card-title">Domain services</text><text x="604" y="490" class="card-copy">Transactions · check-ins</text>
    <rect x="830" y="430" width="222" height="86" rx="14" fill="#fff7df"/><circle cx="856" cy="457" r="10" fill="#ecb94f"/><text x="877" y="461" class="card-title">Insight engine</text><text x="848" y="490" class="card-copy">Streaks · goals · timeline</text>
    <rect x="1074" y="430" width="268" height="86" rx="14" fill="#f2eef5"/><circle cx="1100" cy="457" r="10" fill="#82749d"/><text x="1121" y="461" class="card-title">Request telemetry</text><text x="1092" y="490" class="card-copy">Trace ID · latency · JSON logs</text>
  </g>

  <path d="M700 548v47" class="flow"/><text x="723" y="576" class="small">ORM + atomic writes</text>

  <g filter="url(#shadow)">
    <rect x="70" y="608" width="838" height="165" rx="22" fill="#fffdfa" stroke="#e3ddd4"/>
    <text x="98" y="642" class="label">DATA PLANE</text>
    <rect x="98" y="665" width="240" height="78" rx="14" fill="#ece7fb"/><text x="122" y="695" class="card-title">Habit</text><text x="122" y="719" class="card-copy">goal · category · version · archive</text>
    <path d="M338 704h72" class="flow"/><text x="354" y="691" class="small">1 → many</text>
    <rect x="414" y="665" width="240" height="78" rx="14" fill="#e9f7f1"/><text x="438" y="695" class="card-title">Daily check-in</text><text x="438" y="719" class="card-copy">date · note · effort · unique key</text>
    <path d="M654 704h55" class="flow"/>
    <g transform="translate(719 655)"><ellipse cx="67" cy="18" rx="67" ry="18" fill="#4169e1"/><path d="M0 18v53c0 10 30 18 67 18s67-8 67-18V18" fill="#4169e1" opacity=".9"/><ellipse cx="67" cy="71" rx="67" ry="18" fill="#365dcf"/><text x="67" y="51" text-anchor="middle" class="card-title white">PostgreSQL</text></g>
  </g>

  <g filter="url(#shadow)">
    <rect x="932" y="608" width="438" height="165" rx="22" fill="#fffdfa" stroke="#e3ddd4"/>
    <text x="960" y="642" class="label">OPERATIONS PLANE</text>
    <rect x="960" y="666" width="115" height="76" rx="14" fill="#f1edfc"/><text x="1017" y="697" text-anchor="middle" class="card-title">CI</text><text x="1017" y="720" text-anchor="middle" class="card-copy">lint · test</text>
    <rect x="1086" y="666" width="115" height="76" rx="14" fill="#fff0ed"/><text x="1143" y="697" text-anchor="middle" class="card-title">Docker</text><text x="1143" y="720" text-anchor="middle" class="card-copy">non-root</text>
    <rect x="1212" y="666" width="130" height="76" rx="14" fill="#eaf7f2"/><text x="1277" y="697" text-anchor="middle" class="card-title">Health</text><text x="1277" y="720" text-anchor="middle" class="card-copy">live · ready</text>
  </g>

  <path d="M1150 608V548" class="dash"/><text x="1168" y="582" class="small">observe &amp; deliver</text>
  <rect x="70" y="817" width="1300" height="55" rx="14" fill="#2d293c"/>
  <text x="95" y="850" class="small white">CORE GUARANTEES</text>
  <text x="260" y="850" class="card-copy white">Private by ownership</text><circle cx="399" cy="846" r="3" fill="#ae9bff"/>
  <text x="422" y="850" class="card-copy white">One check-in per habit per day</text><circle cx="653" cy="846" r="3" fill="#ae9bff"/>
  <text x="677" y="850" class="card-copy white">Conflict-safe edits</text><circle cx="816" cy="846" r="3" fill="#ae9bff"/>
  <text x="840" y="850" class="card-copy white">Recoverable archive</text><circle cx="995" cy="846" r="3" fill="#ae9bff"/>
  <text x="1019" y="850" class="card-copy white">Portable data export</text>
</svg>
