[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["tracker/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.coverage.run]
source = ["habitpulse", "tracker"]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "*/asgi.py", "*/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
