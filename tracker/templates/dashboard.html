{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>HabitPulse</title>
  <link rel="stylesheet" href="{% static 'tracker/styles.css' %}">
</head>
<body>
  <main class="container">
    <header>
      <p>Secure habit operations dashboard</p>
      <h1>HabitPulse</h1>
      <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>Sign out</button></form>
    </header>

    <section aria-labelledby="summary-title">
      <h2 id="summary-title">This week</h2>
      <dl>
        <div><dt>Total</dt><dd id="total">0</dd></div>
        <div><dt>Completed</dt><dd id="completed">0</dd></div>
        <div><dt>Pending</dt><dd id="pending">0</dd></div>
        <div><dt>Rate</dt><dd id="rate">0%</dd></div>
      </dl>
    </section>

    <section aria-labelledby="create-title">
      <h2 id="create-title">Create a habit</h2>
      <form id="habit-form">
        <label>Name <input id="habit-name" maxlength="100" required></label>
        <label>Target days per week <input id="habit-target" type="number" min="1" max="7" value="7" required></label>
        <button type="submit">Add habit</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Your habits</h2>
      <ul id="habit-list"></ul>
    </section>
  </main>
  <script src="{% static 'tracker/dashboard.js' %}" defer></script>
</body>
</html>
